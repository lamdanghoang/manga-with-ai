packages:
  - "packages/*"

# MiniPay security: reject packages published less than 7 days ago
minimumReleaseAge: 10080

allowBuilds:
  '@google/genai': true
  '@sentry/cli': true
  '@prisma/client': true
  '@prisma/engines': true
  bufferutil: true
  esbuild: true
  keccak: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  secp256k1: true
  sharp: true
  utf-8-validate: true

onlyBuiltDependencies:
  - "@google/genai"
  - "@prisma/client"
  - "@prisma/engines"
  - bufferutil
  - esbuild
  - keccak
  - msgpackr-extract
  - prisma
  - protobufjs
  - secp256k1
  - sharp
  - utf-8-validate
